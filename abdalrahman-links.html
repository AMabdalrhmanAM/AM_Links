<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM &middot; Links</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}

  @keyframes float1{
    0%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(50px,-40px) scale(1.12); }
    66%{ transform: translate(-20px,20px) scale(0.92); }
    100%{ transform: translate(0,0) scale(1); }
  }
  @keyframes float2{
    0%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(-45px,30px) scale(1.15); }
    66%{ transform: translate(20px,-25px) scale(0.9); }
    100%{ transform: translate(0,0) scale(1); }
  }
  @keyframes float3{
    0%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(30px,40px) scale(0.9); }
    66%{ transform: translate(-30px,-15px) scale(1.1); }
    100%{ transform: translate(0,0) scale(1); }
  }
  @keyframes hueShift{
    0%,100%{ filter:blur(70px) hue-rotate(0deg); }
    50%{ filter:blur(70px) hue-rotate(35deg); }
  }

  body{
    position:relative;
    min-height:100vh;
    overflow-x:hidden;
    background:#0B0A14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.55;
    z-index:0;
    animation: hueShift 10s ease-in-out infinite;
  }
  .blob1{
    width:420px; height:420px;
    background:radial-gradient(circle, #7C3AED, transparent 70%);
    top:-10%; left:-15%;
    animation: float1 13s ease-in-out infinite, hueShift 9s ease-in-out infinite;
  }
  .blob2{
    width:380px; height:380px;
    background:radial-gradient(circle, #EC4899, transparent 70%);
    bottom:-10%; right:-15%;
    animation: float2 15s ease-in-out infinite, hueShift 11s ease-in-out infinite;
  }
  .blob3{
    width:340px; height:340px;
    background:radial-gradient(circle, #06B6D4, transparent 70%);
    top:40%; left:60%;
    animation: float3 17s ease-in-out infinite, hueShift 8s ease-in-out infinite;
  }
  .blob4{
    width:300px; height:300px;
    background:radial-gradient(circle, #F59E0B, transparent 70%);
    bottom:20%; left:5%;
    animation: float1 12s ease-in-out infinite reverse, hueShift 13s ease-in-out infinite;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
  }

  .logo-panel{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 26px;
  }
  .logo-panel img{
    width:210px;
    height:auto;
    mix-blend-mode:screen;
    filter: drop-shadow(0 0 26px rgba(255,255,255,0.28)) drop-shadow(0 4px 14px rgba(0,0,0,0.35));
    animation: logoFloat 6s ease-in-out infinite, logoPulse 4s ease-in-out infinite;
  }

  @keyframes logoFloat{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-12px) rotate(-1deg); }
  }
  @keyframes logoPulse{
    0%,100%{ filter: drop-shadow(0 0 18px rgba(255,255,255,0.22)) drop-shadow(0 4px 14px rgba(0,0,0,0.35)); }
    50%{ filter: drop-shadow(0 0 38px rgba(255,255,255,0.45)) drop-shadow(0 4px 14px rgba(0,0,0,0.35)); }
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .tagline{
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:3.5px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.65);
    margin-bottom:24px;
    opacity:0;
    animation: fadeInUp .6s ease forwards;
    animation-delay:.2s;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  a.link{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:18px;
    text-decoration:none;
    color:#F5F3FF;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.2px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: transform .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
    opacity:0;
    animation: fadeInUp .6s ease forwards;
  }
  .links a:nth-child(1){ animation-delay: .05s; }
  .links a:nth-child(2){ animation-delay: .12s; }
  .links a:nth-child(3){ animation-delay: .19s; }
  .links a:nth-child(4){ animation-delay: .26s; }
  .links a:nth-child(5){ animation-delay: .33s; }
  .links a:nth-child(6){ animation-delay: .40s; }
  .links a:nth-child(7){ animation-delay: .47s; }
  .links a:nth-child(8){ animation-delay: .54s; }
  .links a:nth-child(9){ animation-delay: .61s; }
  a.link:hover{
    transform: translateY(-3px) scale(1.01);
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  a.link:hover .icon{
    transform: scale(1.12) rotate(-4deg);
  }
  a.link:active{ transform: translateY(-1px) scale(0.99); }
  a.link:focus-visible{
    outline:2px solid rgba(255,255,255,0.6);
    outline-offset:3px;
  }

  .icon{
    --accent:#fff;
    width:38px;
    height:38px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform .35s ease;
  }
  .icon svg{
    width:18px;
    height:18px;
    color: var(--accent);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent));
  }

  .label{ flex:1; }
  .go{
    color:rgba(255,255,255,0.45);
    font-size:15px;
    transition: transform .3s ease, color .3s ease;
  }
  a.link:hover .go{ transform:translateX(4px); color:#fff; }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:10.5px;
    letter-spacing:2.5px;
    color:rgba(255,255,255,0.35);
    text-transform:uppercase;
  }
</style>
</head>
